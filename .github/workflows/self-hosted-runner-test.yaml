
name: GKE Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: todo-app-runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Runner Information
        run: |
          echo "Hello from GKE Self Hosted Runner"
          echo "Runner Name: $RUNNER_NAME"
          echo "Operating System: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

      - name: Check Workspace
        run: |
          pwd
          ls -la

      - name: Verify Kubernetes CLI
        run: |
          kubectl version --client || echo "kubectl is not installed"
