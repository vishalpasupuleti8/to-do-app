name: GKE Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/runner-test'

permissions:
  contents: read

jobs:
  test:
    name: Test GKE Runner
    runs-on: todo-app-runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Arch: $RUNNER_ARCH"
          uname -a
          whoami
          git --version
          curl --version