
name: GKE Self Hosted Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test GKE Runner
    runs-on: todo-app-runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify GKE Self Hosted Runner
        run: |
          echo "================================="
          echo "GKE SELF HOSTED RUNNER SUCCESS"
          echo "================================="
          echo "Runner Name: $RUNNER_NAME"
          echo "Operating System: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

      - name: Check Linux Environment
        run: |
          uname -a
          whoami
          pwd

      - name: Verify Git
        run: git --version

      - name: Verify Curl
        run: curl --version
