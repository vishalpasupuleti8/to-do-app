name: To-Do App Docker Hub GKE CI-CD

on:
  push:
    branches:
      - 'feature/**'
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: FRONTEND CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build


  # JOB 2: BACKEND CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Build Backend Docker Image
        run: docker build -t todo-backend:test ./backend

  # JOB 3: BUILD AND PUSH TO DOCKER HUB
  docker-build-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend-ci
      - backend-ci

    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          docker build \
            -t vishalpasupuleti/todo-frontend:${GITHUB_SHA} \
            -t vishalpasupuleti/todo-frontend:latest \
            ./frontend

          docker push vishalpasupuleti/todo-frontend:${GITHUB_SHA}
          docker push vishalpasupuleti/todo-frontend:latest

      - name: Build and Push Backend
        run: |
          docker build \
            -t vishalpasupuleti/todo-backend:${GITHUB_SHA} \
            -t vishalpasupuleti/todo-backend:latest \
            ./backend

          docker push vishalpasupuleti/todo-backend:${GITHUB_SHA}
          docker push vishalpasupuleti/todo-backend:latest

  # JOB 4: DEPLOY TO GKE
  deploy-to-gke:
    name: Deploy Application to GKE
    runs-on: ubuntu-latest

    needs:
      - docker-build-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials \
            "${{ vars.GKE_CLUSTER }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - name: Update Kubernetes Image Tags
        run: |
          sed -i "s|IMAGE_TAG|${GITHUB_SHA}|g" \
            k8s/backend.yaml k8s/frontend.yaml

      - name: Deploy Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy Backend
        run: kubectl apply -f k8s/backend.yaml

      - name: Deploy Frontend
        run: kubectl apply -f k8s/frontend.yaml

      - name: Verify Backend Deployment
        run: |
          kubectl rollout status deployment/backend \
            -n todo-app --timeout=300s

      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status deployment/frontend \
            -n todo-app --timeout=300s

      - name: Display Kubernetes Resources
        run: |
          kubectl get pods -n todo-app
          kubectl get deployments -n todo-app
          kubectl get services -n todo-app
